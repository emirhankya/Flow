<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05050a" />
  <title>Proje Keşfi — Flow</title>
  <meta name="description" content="Projenizi tanıyalım — bütçe, proje tipi ve zaman çizelgesi." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            background: '#05050a',
            foreground: '#f0f0ff',
            surface: '#0d0d16',
            border: '#1c1c30',
            'border-bright': '#2a2a44',
            'muted-foreground': '#6b6b90',
            primary: '#7c6fff',
            accent: '#a78bfa',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    html { -webkit-font-smoothing: antialiased; }
    .font-display { letter-spacing: -0.03em; }
    .cta-button { position: relative; overflow: hidden; }
    .cta-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #7c6fff, #a78bfa);
      transition: opacity 0.3s ease;
    }
    .cta-button:hover::before { opacity: 0.85; }
    .option-card input:checked + label {
      border-color: rgba(124, 111, 255, 0.6);
      background: rgba(124, 111, 255, 0.12);
    }
    .option-card input:focus-visible + label {
      outline: 2px solid #7c6fff;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-full bg-background text-foreground font-sans antialiased">

  <header class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-4 mt-4 md:mx-8 lg:mx-12 rounded-2xl border border-border bg-[#05050a]/80 backdrop-blur-xl px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2" aria-label="Flow ana sayfa">
        <span class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center shrink-0">
          <span class="text-white text-sm font-bold font-display leading-none" aria-hidden="true">F</span>
        </span>
        <span class="font-display font-semibold tracking-tight">FLOW</span>
      </a>
      <a href="index.html" class="text-sm text-muted-foreground hover:text-foreground transition-colors">← Ana sayfa</a>
    </div>
  </header>

  <main class="min-h-screen flex items-center justify-center px-6 pt-32 pb-16">
    <div class="w-full max-w-xl">
      <div class="mb-10 text-center">
        <p class="text-xs font-semibold tracking-widest uppercase text-primary mb-3">Adım 1 / 2</p>
        <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">Projenizi Tanıyalım</h1>
        <p class="text-muted-foreground text-base">Birkaç kısa soruyla ihtiyaçlarınızı anlayalım, ardından size özel teklif formuna geçelim.</p>
      </div>

      <form id="discovery-form" class="rounded-2xl border border-border bg-surface/60 backdrop-blur-sm p-6 sm:p-8 space-y-8" novalidate>

        <fieldset>
          <legend class="text-sm font-semibold mb-4">Proje tipi</legend>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="option-card">
              <input type="radio" name="projectType" id="type-web" value="web" class="sr-only" required />
              <label for="type-web" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Web sitesi / Landing
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="projectType" id="type-app" value="app" class="sr-only" />
              <label for="type-app" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Web / Mobil Uygulama
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="projectType" id="type-brand" value="brand" class="sr-only" />
              <label for="type-brand" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Marka &amp; Kimlik
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="projectType" id="type-other" value="other" class="sr-only" />
              <label for="type-other" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Diğer
              </label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="text-sm font-semibold mb-4">Bütçe aralığı</legend>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="option-card">
              <input type="radio" name="budget" id="budget-1" value="50k-alti" class="sr-only" required />
              <label for="budget-1" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                50.000 ₺ altı
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="budget" id="budget-2" value="50k-150k" class="sr-only" />
              <label for="budget-2" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                50.000 – 150.000 ₺
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="budget" id="budget-3" value="150k-500k" class="sr-only" />
              <label for="budget-3" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                150.000 – 500.000 ₺
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="budget" id="budget-4" value="500k-ustu" class="sr-only" />
              <label for="budget-4" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                500.000 ₺ üzeri
              </label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="text-sm font-semibold mb-4">Zaman çizelgesi</legend>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="option-card">
              <input type="radio" name="timeline" id="time-1" value="acil" class="sr-only" required />
              <label for="time-1" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Acil (1 ay içinde)
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="timeline" id="time-2" value="1-3-ay" class="sr-only" />
              <label for="time-2" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                1 – 3 ay
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="timeline" id="time-3" value="3-6-ay" class="sr-only" />
              <label for="time-3" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                3 – 6 ay
              </label>
            </div>
            <div class="option-card">
              <input type="radio" name="timeline" id="time-4" value="esnek" class="sr-only" />
              <label for="time-4" class="block cursor-pointer rounded-xl border border-border px-4 py-3 text-sm font-medium transition-colors hover:border-border-bright">
                Esnek / henüz belirsiz
              </label>
            </div>
          </div>
        </fieldset>

        <p id="form-error" class="hidden text-sm text-red-400" role="alert">Lütfen tüm alanları doldurun.</p>

        <button
          type="submit"
          class="cta-button w-full inline-flex items-center justify-center gap-2 rounded-2xl px-8 py-4 text-base font-semibold text-white shadow-[0_0_40px_rgba(124,111,255,0.25)] transition-all duration-300 hover:shadow-[0_0_60px_rgba(124,111,255,0.45)] hover:scale-[1.01] active:scale-[0.99]"
        >
          <span class="relative z-10">Teklif Formuna Devam Et</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('discovery-form');
    const errorEl = document.getElementById('form-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      if (!data.projectType || !data.budget || !data.timeline) {
        errorEl.classList.remove('hidden');
        return;
      }
      errorEl.classList.add('hidden');
      sessionStorage.setItem('flowDiscovery', JSON.stringify(data));
      window.location.href = 'teklif.html';
    });
  </script>

  <script src="js/whatsapp-widget.js"></script>
</body>
</html>
