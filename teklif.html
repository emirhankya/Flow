<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05050a" />
  <title>Teklif Formu — Flow</title>
  <meta name="description" content="Projeniz için teklif alın — iletişim bilgilerinizi paylaşın." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            background: '#05050a',
            foreground: '#f0f0ff',
            surface: '#0d0d16',
            border: '#1c1c30',
            'border-bright': '#2a2a44',
            'muted-foreground': '#6b6b90',
            primary: '#7c6fff',
            accent: '#a78bfa',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    html { -webkit-font-smoothing: antialiased; }
    .font-display { letter-spacing: -0.03em; }
    .cta-button { position: relative; overflow: hidden; }
    .cta-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #7c6fff, #a78bfa);
      transition: opacity 0.3s ease;
    }
    .cta-button:hover::before { opacity: 0.85; }
    .field-input {
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid #1c1c30;
      background: #05050a;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #f0f0ff;
      transition: border-color 0.2s;
    }
    .field-input:focus {
      outline: none;
      border-color: rgba(124, 111, 255, 0.6);
    }
    .field-input::placeholder { color: #6b6b90; }
  </style>
</head>
<body class="min-h-full bg-background text-foreground font-sans antialiased">

  <header class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-4 mt-4 md:mx-8 lg:mx-12 rounded-2xl border border-border bg-[#05050a]/80 backdrop-blur-xl px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2" aria-label="Flow ana sayfa">
        <span class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center shrink-0">
          <span class="text-white text-sm font-bold font-display leading-none" aria-hidden="true">F</span>
        </span>
        <span class="font-display font-semibold tracking-tight">FLOW</span>
      </a>
      <a href="kesif.html" class="text-sm text-muted-foreground hover:text-foreground transition-colors">← Keşif formu</a>
    </div>
  </header>

  <main class="min-h-screen flex items-center justify-center px-6 pt-32 pb-16">
    <div class="w-full max-w-xl">
      <div class="mb-10 text-center">
        <p class="text-xs font-semibold tracking-widest uppercase text-primary mb-3">Adım 2 / 2</p>
        <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">Teklif Formu</h1>
        <p class="text-muted-foreground text-base">İletişim bilgilerinizi paylaşın, 24 saat içinde size dönelim.</p>
      </div>

      <div id="discovery-summary" class="hidden mb-6 rounded-xl border border-primary/20 bg-primary/5 px-4 py-3 text-sm text-muted-foreground"></div>

      <form
        id="quote-form"
        method="POST"
        class="rounded-2xl border border-border bg-surface/60 backdrop-blur-sm p-6 sm:p-8 space-y-5"
      >
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true" />

        <div>
          <label for="name" class="block text-sm font-medium mb-2">Ad Soyad</label>
          <input type="text" id="name" name="name" required autocomplete="name" class="field-input" placeholder="Adınız Soyadınız" />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium mb-2">E-posta</label>
          <input type="email" id="email" name="email" required autocomplete="email" class="field-input" placeholder="ornek@firma.com" />
        </div>

        <div>
          <label for="company" class="block text-sm font-medium mb-2">Şirket / Marka</label>
          <input type="text" id="company" name="company" class="field-input" placeholder="Firma adı (opsiyonel)" />
        </div>

        <div>
          <label for="message" class="block text-sm font-medium mb-2">Proje detayları</label>
          <textarea id="message" name="message" rows="4" class="field-input resize-none" placeholder="Hedefleriniz, referanslar veya ek notlar..."></textarea>
        </div>

        <p id="form-error" class="hidden text-sm text-red-400" role="alert"></p>

        <button
          type="submit"
          id="submit-btn"
          class="cta-button w-full inline-flex items-center justify-center gap-2 rounded-2xl px-8 py-4 text-base font-semibold text-white shadow-[0_0_40px_rgba(124,111,255,0.25)] transition-all duration-300 hover:shadow-[0_0_60px_rgba(124,111,255,0.45)] hover:scale-[1.01] active:scale-[0.99] disabled:opacity-60 disabled:pointer-events-none"
        >
          <span class="relative z-10" id="submit-btn-text">Teklif Talebini Gönder</span>
        </button>
      </form>

      <div id="success-message" class="hidden mt-6 rounded-xl border border-primary/30 bg-primary/10 px-4 py-3 text-sm text-center" role="status">
        Talebiniz alındı. En kısa sürede sizinle iletişime geçeceğiz.
      </div>
    </div>
  </main>

  <script src="js/formspree.js"></script>
  <script>
    document.getElementById('quote-form').action = FLOW_FORMSPREE.ENDPOINT;

    const labels = {
      projectType: {
        web: 'Web sitesi / Landing',
        app: 'Web / Mobil Uygulama',
        brand: 'Marka & Kimlik',
        other: 'Diğer',
      },
      budget: {
        '50k-alti': '50.000 ₺ altı',
        '50k-150k': '50.000 – 150.000 ₺',
        '150k-500k': '150.000 – 500.000 ₺',
        '500k-ustu': '500.000 ₺ üzeri',
      },
      timeline: {
        acil: 'Acil (1 ay içinde)',
        '1-3-ay': '1 – 3 ay',
        '3-6-ay': '3 – 6 ay',
        esnek: 'Esnek / henüz belirsiz',
      },
    };

    const raw = sessionStorage.getItem('flowDiscovery');
    if (!raw) {
      window.location.replace('kesif.html');
    } else {
      const data = JSON.parse(raw);
      const summary = document.getElementById('discovery-summary');
      summary.classList.remove('hidden');
      summary.innerHTML =
        '<span class="text-foreground font-medium">Keşif özeti:</span> ' +
        labels.projectType[data.projectType] + ' · ' +
        labels.budget[data.budget] + ' · ' +
        labels.timeline[data.timeline];
    }

    document.getElementById('quote-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const submitBtn = document.getElementById('submit-btn');
      const submitBtnText = document.getElementById('submit-btn-text');
      const errorEl = document.getElementById('form-error');
      const discovery = JSON.parse(sessionStorage.getItem('flowDiscovery') || '{}');
      const formData = Object.fromEntries(new FormData(form));

      if (formData._gotcha) return;

      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtnText.textContent = 'Gönderiliyor...';

      try {
        await FLOW_FORMSPREE.submit({
          name: formData.name,
          email: formData.email,
          company: formData.company || '',
          message: formData.message || '',
          project_type: labels.projectType[discovery.projectType] || discovery.projectType || '',
          budget: labels.budget[discovery.budget] || discovery.budget || '',
          timeline: labels.timeline[discovery.timeline] || discovery.timeline || '',
          _replyto: formData.email,
          _subject: 'Flow Teklif Talebi — ' + formData.name,
        });

        form.classList.add('hidden');
        document.getElementById('success-message').classList.remove('hidden');
        sessionStorage.removeItem('flowDiscovery');
      } catch {
        errorEl.textContent = 'Gönderim sırasında bir hata oluştu. Lütfen tekrar deneyin.';
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtnText.textContent = 'Teklif Talebini Gönder';
      }
    });
  </script>

  <script src="js/whatsapp-widget.js"></script>
</body>
</html>
